{% extends "base.html" %}
{% block contenido %}
<div class="card">
  <h1>Eliminar · {{ titulo }}</h1>
  <p>¿Seguro que deseas eliminar <strong>{{ object }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">{% csrf_token %}
    <button class="btn rojo">Sí, eliminar</button>
    <a class="btn sec" href="{% url 'lista' slug %}">Cancelar</a>
  </form>
</div>
{% endblock %}
