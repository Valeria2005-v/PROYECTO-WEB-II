{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<h1>Iniciar sesión</h1>
<form method="post" class="card" style="max-width:420px">
  {% csrf_token %}
  {{ form.non_field_errors }}
  {% for c in form %}
  <div class="campo">{{ c.label_tag }}{{ c }}{{ c.errors }}</div>
  {% endfor %}
  <input type="hidden" name="next" value="{{ next }}">
  <p><button class="btn">Entrar</button></p>
</form>
{% endblock %}
